            <div id="mainpage">

                <div id="rightColumn">

                        <!--<div class="galleryImageDisplay">
                            <img class="galleryImage" src="https://placehold.co/1920x1080">
                            <div class="galleryImageDetails">
                                <p class="galleryImageName">Image Name</p>
                                <p class="galleryImageSettingsInfo">ISO 800 | Shutter Speed 1/100 | </p>

        <script src="/exif.js"></script>
        <script>
            loadGallery();

            function getImageSettings(img, callback) {
                if (img.complete) {
                    EXIF.getData(img, function() {
                                const aperture = EXIF.getTag(this, "FNumber");
                                const iso = EXIF.getTag(this, "ISOSpeedRatings");
                                const cameraModel = EXIF.getTag(this, "Model");
                                const shutterSpeed = EXIF.getTag(this, "ExposureTime");

                                const imgSettings =
                                    `Model: ${cameraModel} | ISO: ${iso} | Aperture: f/${aperture} | Shutter Speed: ${shutterSpeed.numerator}/${shutterSpeed.denominator}`;

                                callback(imgSettings);
                            });
                } else {
                    img.onload = () => 
                    EXIF.getData(img, function() {
                                const aperture = EXIF.getTag(this, "FNumber");
                                const iso = EXIF.getTag(this, "ISOSpeedRatings");
                                const cameraModel = EXIF.getTag(this, "Model");
                                const shutterSpeed = EXIF.getTag(this, "ExposureTime");

                                const imgSettings =
                                    `Model: ${cameraModel} | ISO: ${iso} | Aperture: f/${aperture} | Shutter Speed: ${shutterSpeed.numerator}/${shutterSpeed.denominator}`;

                                callback(imgSettings);
                            });
                        };
            }

            function loadGallery() {
                const xmlUrl = '/gallery.xml';

                fetch(xmlUrl)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Network response was not ok');
                        }
                        return response.text();
                    })
                    .then(xmlString => {
                        const projects = parseXML(xmlString);
                        console.log(projects);
                    })
                    .catch(error => {
                        console.error('There was a problem fetching the XML file:', error);
                        alert('There was a problem fetching the gallery data: ' + error.message);
                    });

                function parseXML(xmlString) {
                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(xmlString, 'application/xml');

                    const projectNodes = xmlDoc.getElementsByTagName('img');

                    for (let i = 0; i < projectNodes.length; i++) {
                        const galleryImg = projectNodes[i];
                        const name = galleryImg.getElementsByTagName('name')[0].textContent;
                        const img = galleryImg.getElementsByTagName('url')[0].textContent;
                        const imgType = galleryImg.getElementsByTagName('type')[0].textContent;

                        let newgalleryImgDiv = document.createElement("div");
                        newgalleryImgDiv.className = "galleryImageDisplay";
                        
                        let newgalleryImg = document.createElement("img");
                        newgalleryImg.className = "galleryImage";
                        newgalleryImg.src = img;

                        newgalleryImgDiv.appendChild(newgalleryImg);

                        let newInfoContainer = document.createElement("div");
                        newInfoContainer.className = "galleryImageDetails";

                        let galleryImgName = document.createElement("a");
                        galleryImgName.className = "galleryImageName";
                        galleryImgName.textContent = name;

                        let galleryImgSettingsInfo = document.createElement("p");
                        
                        if (imgType === "Photo") {
                            getImageSettings(newgalleryImg, function(settingsInfo) {
                                console.log(settingsInfo);

                                galleryImgSettingsInfo.className = "galleryImageSettingsInfo";
                                galleryImgSettingsInfo.textContent = settingsInfo;
                            });
                        }

                        let galleryImgType = document.createElement("p");
                        galleryImgType.className = "galleryImageType";
                        galleryImgType.textContent = imgType;

                        newInfoContainer.appendChild(galleryImgName);
                        if (imgType === "Photo") { newInfoContainer.appendChild(galleryImgSettingsInfo); }
                        newInfoContainer.appendChild(galleryImgType);

                        newgalleryImgDiv.appendChild(newInfoContainer);
                        document.getElementById("gallery").appendChild(newgalleryImgDiv);
                    }
                }
            }
        </script>
    </body>
</html>
